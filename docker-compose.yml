services:
  agentflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentflow-ai
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - LLM_PROVIDER=gemini
      - GEMINI_MODEL=gemini-1.5-flash
      - MAX_AGENT_ITERATIONS=10
    volumes:
      - agentflow_data:/app/backend/data
    restart: unless-stopped

volumes:
  agentflow_data:

